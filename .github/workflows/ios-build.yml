name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify calculator engines
        run: |
          swiftc FxProCalculator/CalculatorEngine.swift Tests/main.swift -o /tmp/calculator-tests
          /tmp/calculator-tests
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild -project FxProCalculator.xcodeproj -scheme FxProCalculator -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FxProCalculator.app Payload/
          zip -qry FxProCalculator-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FxProCalculator-unsigned-IPA
          path: FxProCalculator-unsigned.ipa
